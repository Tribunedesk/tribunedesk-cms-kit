[project]
name = "tdkit"
dynamic = ["version"]
description = "Tribune Desk CMS integration kit: a local mock of Tribune Desk and conformance checks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
tdkit = "tdkit.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tdkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tdkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code of the projects the skill builds (eval fixtures), not of the kit.
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "ci", "evals"]
exclude = ["evals/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
